<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentBuddy 设计方向</title><style>*{box-sizing:border-box}body{font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;background:#f3f6f9;color:#253b4d;margin:0;padding:32px}h1{font-size:28px;margin-bottom:6px}p{color:#526a7c}a{color:#1766ad}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:28px}.item{background:white;border:1px solid #dbe5ed;border-radius:15px;overflow:hidden}.caption{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.caption strong{font-size:17px}.frame{height:300px;position:relative;overflow:hidden;pointer-events:none}iframe{border:0;width:1440px;height:900px;transform:scale(.4);transform-origin:0 0;pointer-events:none}@media(max-width:1000px){.grid{grid-template-columns:1fr}}@media(max-width:500px){body{padding:18px}.frame{height:200px}iframe{transform:scale(.25)}.caption{font-size:13px;padding:14px}}a{min-height:44px;display:inline-flex;align-items:center}</style><h1>给 AgentBuddy 一个更清晰的界面</h1><p>前三版是完整交互初稿，后三版作为备选。建议先看 A，再比较 B、C 的布局。预览不会请求模型或修改项目。</p><div class="grid"><article class="item" data-thumb="1"><div class="caption"><div><strong>A　轻盈对话台</strong><div>推荐 · 接近 WorkBuddy 的轻盈交互</div></div><a href="dir-1.html">打开预览</a></div><div class="frame"><iframe title="轻盈对话台" src="dir-1.html" tabindex="-1" loading="lazy"></iframe></div></article><article class="item" data-thumb="2"><div class="caption"><div><strong>B　分栏工作台</strong><div>输入与专家并列，减少来回切换</div></div><a href="dir-2.html">打开预览</a></div><div class="frame"><iframe title="分栏工作台" src="dir-2.html" tabindex="-1" loading="lazy"></iframe></div></article><article class="item" data-thumb="3"><div class="caption"><div><strong>C　极简项目桌面</strong><div>顶部导航，项目与输入左右分工</div></div><a href="dir-3.html">打开预览</a></div><div class="frame"><iframe title="极简项目桌面" src="dir-3.html" tabindex="-1" loading="lazy"></iframe></div></article><article class="item" data-thumb="4"><div class="caption"><div><strong>D　紧凑日常</strong><div>备选 · 更紧凑的任务入口</div></div><a href="dir-4.html">打开预览</a></div><div class="frame"><iframe title="紧凑日常" src="dir-4.html" tabindex="-1" loading="lazy"></iframe></div></article><article class="item" data-thumb="5"><div class="caption"><div><strong>E　专家优先</strong><div>备选 · 先选角色，再描述任务</div></div><a href="dir-5.html">打开预览</a></div><div class="frame"><iframe title="专家优先" src="dir-5.html" tabindex="-1" loading="lazy"></iframe></div></article><article class="item" data-thumb="6"><div class="caption"><div><strong>F　专注书写</strong><div>备选 · 少装饰，专注书写</div></div><a href="dir-6.html">打开预览</a></div><div class="frame"><iframe title="专注书写" src="dir-6.html" tabindex="-1" loading="lazy"></iframe></div></article></div><script>document.querySelectorAll(".frame").forEach(f=>{new ResizeObserver(()=>{let s=f.clientWidth/1440;f.firstElementChild.style.transform="scale("+s+")";f.style.height=(900*s)+"px"}).observe(f)})</script></html>
