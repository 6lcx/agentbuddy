<main class="main"><div class="topline"><span>个人工作台</span><span>新任务</span></div><section id="chat"><div class="workspace"><header class="welcome"><h1>今天，想做些什么？</h1><p>说出你的想法，让合适的专家来帮忙。</p><div class="project-home"><h2>继续手上的项目</h2><button data-project>星河项目周报<small>文档与历史版本</small></button><button data-project>读书会活动页面<small>源码与项目资料</small></button></div></header><div class="primary-work"><div class="shortcuts"><button data-prompt="帮我生成一份项目周报。">写文档</button><button data-prompt="分析我上传的销售数据。">分析数据</button><button data-prompt="制作三页项目介绍演示文稿。">做演示</button><button data-prompt="帮我做一个读书会活动介绍网页。">写代码</button></div><div class="compose"><div class="chips" id="chips"></div><textarea id="message" aria-label="消息" placeholder="描述你的任务，或上传文件一起处理…"></textarea><div id="attachments" class="attachments"></div><div class="tools"><div><input type="file" id="file" hidden multiple><button id="attach" class="plus" aria-label="添加附件">＋</button><button id="role" aria-label="选择专家"></button><button id="skills">✧ 技能</button><button id="advanced" aria-label="任务设置">···</button></div><div><button id="model" class="model" aria-label="模型设置">DeepSeek ⌄</button><button id="send" class="send" aria-label="发送">↑</button></div></div></div><div class="under"><button data-project>▱ 新项目工作空间 ⌄</button><span>资料和文件随项目保存</span></div><div class="suggestions"><h2>也可以从这些任务开始</h2><button data-prompt="整理会议记录，生成纪要和待办清单。">把会议记录变成纪要和待办 </button><button data-prompt="制作预算表，用公式汇总开发、设计和测试费用。">做一份能自动计算的项目预算表 </button><button data-prompt="分析产品需求，先制定计划，再实现网页。">从一个产品想法开始写代码 </button></div></div><aside id="recommend" class="recommend"></aside></div></section>

const experts=[{name:'开发专家',icon:'⌘',tone:'purple',desc:'从想法到源码，帮你拆解需求、实现功能并验证结果。',tags:['项目开发','代码检查'],examples:['帮我做一个读书会活动介绍网页，交付 HTML 和 CSS 文件。','用 Python 写一个 CSV 汇总工具，并附上使用说明和测试。','检查上传的项目代码，先列出问题，再帮我修复。']},{name:'文档专家',icon:'W',tone:'',desc:'把零散资料整理成清晰的报告、周报与会议纪要。',tags:['Word 文档','内容整理'],examples:['根据上传的会议记录，生成 Word 纪要和待办清单。','帮我写一份项目周报，包含进展、风险和下周计划。','整理资料，生成一份带来源说明的分析报告。']},{name:'表格专家',icon:'X',tone:'green',desc:'整理数据、编写公式，用表格与图表呈现重点。',tags:['Excel 表格','数据分析'],examples:['制作一份项目预算表，用公式汇总各项费用。','读取销售表，按地区汇总销售额。','在本项目生成的预算表中增加测试费用。']},{name:'演示专家',icon:'P',tone:'amber',desc:'提炼信息、安排叙事，把项目讲得清楚易懂。',tags:['PPT 演示','汇报表达'],examples:['制作三页项目介绍 PPT，包含目标、计划和成果。','将上传的报告整理成五页汇报演示稿。','修改本项目生成的 PPT，增加下一步行动页。']}];
const skills=[{name:'Word 文档处理',icon:'W',tone:''},{name:'Excel 表格处理',icon:'X',tone:'green'},{name:'PowerPoint 演示处理',icon:'P',tone:'amber'},{name:'开发与验证',icon:'⌘',tone:'purple'}];
let role='通用助手',chosen=['Word 文档处理'],kind='expert',view='chat';
const q=s=>document.querySelector(s);const tile=x=>`<span class="tile ${x.tone||''}" aria-hidden="true">${x.icon}</span>`;
function modal(html){q('#modal-body').innerHTML=html;q('#shade').hidden=false;q('#close').focus()}
function close(){q('#shade').hidden=true}q('#close').onclick=close;q('#shade').onclick=e=>{if(e.target.id==='shade')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function renderRole(){const x=experts.find(x=>x.name===role)||{icon:'◉',tone:''};q('#role').innerHTML=tile(x)+role+' ⌄'}
function renderChips(){q('#chips').innerHTML=chosen.map(name=>{const x=skills.find(s=>s.name===name);return `<span class="chip">${tile(x)}${name}<button aria-label="移除${name}" data-remove="${name}">×</button></span>`}).join('');q('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=chosen.filter(x=>x!==b.dataset.remove);renderChips()})}
function rolePicker(){modal('<h2>让谁来帮你？</h2><p>直接开始，或选择擅长这件事的专家。</p>'+['通用助手','自动协作',...experts.map(x=>x.name)].map(name=>`<button class="option" data-role="${name}"><strong>${name}</strong><span>${role===name?'✓':'选择'}</span></button>`).join(''));q('#modal-body').querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;renderRole();close()})}
function skillPicker(){modal('<h2>本次对话的技能</h2><p>临时增减，不修改专家默认配置。</p>'+skills.map(x=>`<div class="checkrow"><label>${tile(x)}${x.name}<input type="checkbox" aria-label="${x.name}" value="${x.name}" ${chosen.includes(x.name)?'checked':''}></label></div>`).join('')+'<p class="hint">只影响下一轮对话，运行中的任务保持原配置。</p>');q('#modal-body').querySelectorAll('input').forEach(x=>x.onchange=()=>{chosen=chosen.filter(n=>n!==x.value);if(x.checked)chosen.push(x.value);renderChips()})}
function setView(next){view=next;q('#chat').hidden=next!=='chat';q('#catalog').hidden=next!=='catalog';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===next));if(next==='catalog')renderCards();window.scrollTo(0,0)}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav));q('#role').onclick=rolePicker;q('#skills').onclick=skillPicker;
function detail(index){let x=experts[index];const isSkill=kind==='skill';if(isSkill)x={...x,name:skills[index].name};modal(`<div class="detailtop">${tile(x)}<div><h2>${x.name}</h2><button class="primary" id="summon">${isSkill?'加入对话':'召唤专家'}</button></div></div><p>${x.desc}</p><div class="tags">${x.tags.map(t=>'<span>'+t+'</span>').join('')}</div><div class="examples"><h3>试试这样说</h3><p class="hint">点击填入输入框，确认后再发送。</p>${x.examples.map((t,i)=>`<button data-example="${i}">${t}</button>`).join('')}</div>`);function use(text){if(isSkill){if(!chosen.includes(x.name))chosen.push(x.name)}else role=x.name;renderRole();renderChips();if(text)q('#message').value=text;setView('chat');close();q('#message').focus()}q('#summon').onclick=()=>use();q('#modal-body').querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>use(x.examples[+b.dataset.example]))}
function renderCards(){const needle=q('#search').value.toLowerCase();if(kind==='connector'){q('#cards').innerHTML='<button class="card" id="connector-detail"><div class="cardhead"><span class="tile green">↗</span><h2>连接外部工具</h2></div><p>把已配置服务的资料和工具带入对话。可用能力以实际连接为准。</p><div class="tags"><span>服务连接</span><span>示意卡片</span></div></button>';q('#connector-detail').onclick=()=>modal('<h2>连接器</h2><p>正式界面会显示你的真实连接器及连接状态。本预览不访问外部服务。</p>');return}q('#cards').innerHTML=experts.map((x,i)=>({x:{...x,name:kind==='skill'?skills[i].name:x.name},i})).filter(({x})=>(x.name+x.desc).toLowerCase().includes(needle)).map(({x,i})=>`<button class="card" data-detail="${i}"><div class="cardhead">${tile(x)}<h2>${x.name}</h2></div><p>${x.desc}</p><div class="tags">${x.tags.map(t=>'<span>'+t+'</span>').join('')}</div><div class="footerline">查看用途与示例</div></button>`).join('')||'<p>没有匹配的能力，换个关键词试试。</p>';q('#cards').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(+b.dataset.detail))}
q('#search').oninput=renderCards;document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-selected',String(x===b))});renderCards()});
document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{q('#message').value=b.dataset.prompt;q('#message').focus()});document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>modal('<h2>项目工作空间</h2><p>正式应用中，此处可继续已有项目，查看资料与历史交付。这里是独立设计预览，不会修改你的项目。</p><button class="option" onclick="close()">新项目草稿</button><button class="option" onclick="close()">星河项目周报 <small>示例项目</small></button>'));
q('#model').onclick=()=>modal('<h2>模型与连接</h2><button class="option" onclick="close()"><strong>DeepSeek</strong><small>当前预览模型</small></button><div class="model-field"><label for="connection">连接名称</label><input id="connection" placeholder="正式应用中可配置模型连接" disabled></div><p class="hint">本页只演示设置入口，不保存密钥、不请求模型服务。</p>');q('#advanced').onclick=()=>modal('<h2>任务设置</h2><p>默认直接执行普通分析、读取和文件生成。发送、发布或删除外部数据前展示内容并确认。</p><p class="hint">正式应用支持执行时长与调用次数预算；不增加权限模式或沙箱。</p>');q('#send').onclick=()=>modal('<h2>这是设计预览</h2><p>角色、技能和消息都已准备好。本预览不会发送任务或消耗模型额度；选定设计后将接入现有 React 功能。</p>');q('#file').onchange=e=>q('#attachments').textContent=Array.from(e.target.files).map(f=>f.name).join(' · ');q('#attach').onclick=()=>q('#file').click();q('#manage').onclick=()=>modal('<h2>能力管理</h2><p>正式版本保留专家创建、技能导入、连接器配置和版本维护，收纳在管理抽屉中。</p>');q('#recommend').innerHTML='<h2>给任务找位搭档</h2>'+experts.slice(0,3).map((x,i)=>`<button data-rec="${i}">${tile(x)}<span>${x.name}<small>${x.tags.join(' / ')}</small></span></button>`).join('');q('#recommend').querySelectorAll('button').forEach(b=>b.onclick=()=>{kind='expert';detail(+b.dataset.rec)});renderChips();renderRole();
</script></body></html>
